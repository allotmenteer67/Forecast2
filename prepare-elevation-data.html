<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build elevation data — Cloude</title>
<!--
  A one-off tool, not part of the app. Open it, tap Start, leave it
  running, then upload the file it produces to data/elevation-uk.json.
  Delete it from the repo afterwards if you like — nothing links to it.

  WHY A BROWSER TOOL RATHER THAN A GITHUB ACTION
  The Action kept failing with connect timeouts and rate limits even at
  half the documented request rate, on a completely fresh quota. GitHub's
  runners share IP addresses with a very large number of users, so
  Open-Meteo's throttling almost certainly sees far more traffic from
  those addresses than this job alone. Pacing on our side can't fix
  someone else's usage. Running from your own connection sidesteps that
  entirely — and it's the same approach that already worked for
  coastline-50m.json and places.json.

  DESIGNED AROUND THE iPAD, NOT AGAINST IT
  - Progress is saved to IndexedDB after every batch, so closing the tab,
    locking the screen, or losing signal loses at most one batch. Reopen
    and tap Start; it resumes from where it stopped.
  - A screen Wake Lock is requested so the iPad doesn't sleep mid-run.
    If the browser refuses it, the run still works — just keep the screen
    on, or accept resuming a few times.
  - Safari throttles background tabs hard. If you switch apps it will
    slow or stall; that's not a failure, and it picks up when you come
    back. Best to leave this tab in the foreground.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 -apple-system, system-ui, sans-serif;
    margin: 0; padding: 24px 20px 60px; max-width: 640px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 600; padding: 14px 22px;
    border-radius: 10px; border: 0; background: #2f6f4f; color: #fff;
    min-height: 48px; /* comfortable tap target */
  }
  button:disabled { opacity: .45; }
  button.secondary { background: #6b6b6b; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
  .bar {
    height: 12px; background: rgba(127,127,127,.25);
    border-radius: 6px; overflow: hidden; margin: 16px 0 8px;
  }
  .bar > div { height: 100%; width: 0; background: #2f6f4f; transition: width .3s; }
  .stat { font-variant-numeric: tabular-nums; }
  #log {
    margin-top: 20px; padding: 12px; border-radius: 8px;
    background: rgba(127,127,127,.12); font-family: ui-monospace, monospace;
    font-size: 13px; white-space: pre-wrap; max-height: 320px; overflow-y: auto;
  }
  .done { color: #2f6f4f; font-weight: 600; }
  .warn { color: #b5541c; }
</style>
</head>
<body>

<h1>Build elevation data</h1>
<p class="sub">One-off. Produces <code>elevation-uk.json</code> for Cloude's terrain layer.</p>

<div class="bar"><div id="bar"></div></div>
<p class="stat" id="stat">Ready.</p>

<div class="row">
  <button id="start">Start</button>
  <button id="pause" class="secondary" disabled>Pause</button>
  <button id="download" class="secondary" disabled>Download file</button>
</div>

<p class="sub" id="hint">
  Keep this tab in the foreground. Progress saves continuously — if it
  stops for any reason, just tap Start again and it carries on.
</p>

<div id="log"></div>

<script>
// ---- Grid definition — must match what map.js expects ----
// Bounding box covers mainland GB, Northern Ireland, Ireland, plus the
// Hebrides, Orkney, Shetland and the Scillies.
const LAT_MIN = 49.8, LAT_MAX = 61.0;
const LON_MIN = -8.4, LON_MAX = 2.0;
// ~0.075° latitude is about 8.3km. The terrain layer samples between
// 6km and 26km depending on zoom and interpolates between grid nodes,
// so this is ample for shaded relief.
const D_LAT = 0.075, D_LON = 0.12;
const MAX_COORDS = 100;
// 6s between requests. Much faster than the Action's 20s was forced to
// be, because a home connection isn't competing with everything else
// running on a shared datacentre IP range. Backs off automatically if
// it does get throttled.
const DELAY_MS = 6000;

const ELEVATION_URL = "https://api.open-meteo.com/v1/elevation";
const ROWS = Math.round((LAT_MAX - LAT_MIN) / D_LAT) + 1;
const COLS = Math.round((LON_MAX - LON_MIN) / D_LON) + 1;
const TOTAL = ROWS * COLS;
const TOTAL_BATCHES = Math.ceil(TOTAL / MAX_COORDS);

const $ = id => document.getElementById(id);
let values = [];
let running = false;
let wakeLock = null;

function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  $("log").appendChild(line);
  $("log").scrollTop = $("log").scrollHeight;
}

function updateProgress() {
  const pct = Math.round(100 * values.length / TOTAL);
  $("bar").style.width = pct + "%";
  $("stat").textContent =
    `${values.length.toLocaleString()} / ${TOTAL.toLocaleString()} points (${pct}%)` +
    (values.length >= TOTAL ? " — complete" : "");
  $("download").disabled = values.length === 0;
}

// ---- Progress storage ----
// IndexedDB rather than localStorage: this is bulk data, and
// localStorage's ~5MB is already shared with the app's own settings,
// FFV history and tide data on this same origin.
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("cloude-elevation-build", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("progress");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function saveProgress() {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction("progress", "readwrite");
      tx.objectStore("progress").put({ values, rows: ROWS, cols: COLS, dLat: D_LAT, dLon: D_LON }, "grid");
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) {
    log("Couldn't save progress: " + e.message, "warn");
  }
}
async function loadProgress() {
  try {
    const db = await idb();
    const saved = await new Promise((res, rej) => {
      const tx = db.transaction("progress", "readonly");
      const q = tx.objectStore("progress").get("grid");
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
    // A resolution change makes old values meaningless — they'd silently
    // mix two different grids together, so those start fresh.
    if (saved && saved.rows === ROWS && saved.cols === COLS &&
        saved.dLat === D_LAT && saved.dLon === D_LON) {
      values = saved.values;
      log(`Resuming — ${values.length.toLocaleString()} points already fetched.`);
    } else if (saved) {
      log("Saved progress was for a different grid — starting fresh.", "warn");
    }
  } catch {}
  updateProgress();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchBatch(lats, lons, attempt = 0) {
  const params = new URLSearchParams({
    latitude: lats.map(v => v.toFixed(4)).join(","),
    longitude: lons.map(v => v.toFixed(4)).join(",")
  });
  let res;
  try {
    res = await fetch(`${ELEVATION_URL}?${params}`, { signal: AbortSignal.timeout(30000) });
  } catch (err) {
    if (attempt >= 8) throw err;
    const wait = Math.min(60000, 5000 * (attempt + 1));
    log(`  connection problem — retrying in ${wait / 1000}s`, "warn");
    await sleep(wait);
    return fetchBatch(lats, lons, attempt + 1);
  }
  if (res.status === 429) {
    if (attempt >= 8) throw new Error("Rate limited repeatedly — pause and try later. Progress is saved.");
    const wait = Math.min(300000, 30000 * (attempt + 1));
    log(`  rate limited — waiting ${wait / 1000}s`, "warn");
    await sleep(wait);
    return fetchBatch(lats, lons, attempt + 1);
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return (await res.json()).elevation;
}

async function run() {
  running = true;
  $("start").disabled = true;
  $("pause").disabled = false;

  // Keeps the screen awake so the run isn't interrupted by the iPad
  // sleeping. Not supported everywhere, and not essential — progress
  // survives a sleep either way.
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      log("Screen will stay awake.");
    }
  } catch {}

  // Batches are aligned to MAX_COORDS, so drop any partial trailing
  // batch before resuming rather than fetching overlapping points.
  const startIndex = Math.floor(values.length / MAX_COORDS) * MAX_COORDS;
  values.length = startIndex;

  try {
    for (let i = startIndex; i < TOTAL; i += MAX_COORDS) {
      if (!running) { log("Paused. Progress saved."); break; }
      if (i > startIndex) await sleep(DELAY_MS);

      const lats = [], lons = [];
      for (let n = i; n < Math.min(i + MAX_COORDS, TOTAL); n++) {
        lats.push(LAT_MIN + Math.floor(n / COLS) * D_LAT);
        lons.push(LON_MIN + (n % COLS) * D_LON);
      }

      const elev = await fetchBatch(lats, lons);
      values.push(...elev);
      await saveProgress();
      updateProgress();

      const batch = Math.floor(i / MAX_COORDS) + 1;
      if (batch % 5 === 0 || batch === TOTAL_BATCHES) {
        log(`  ${batch}/${TOTAL_BATCHES} batches`);
      }
    }

    if (values.length >= TOTAL) {
      log("COMPLETE — tap Download file, then upload it to the repo as data/elevation-uk.json", "done");
      $("hint").textContent = "Upload the downloaded file to your repo's data/ folder, named exactly elevation-uk.json";
    }
  } catch (err) {
    log("Stopped: " + err.message, "warn");
    log("Progress is saved — tap Start to continue.", "warn");
  } finally {
    running = false;
    $("start").disabled = false;
    $("pause").disabled = true;
    if (wakeLock) { try { await wakeLock.release(); } catch {} wakeLock = null; }
    await saveProgress();
    updateProgress();
  }
}

$("start").onclick = run;
$("pause").onclick = () => { running = false; };

$("download").onclick = () => {
  const output = {
    note: "Static elevation grid for terrain hillshading. Built by prepare-elevation-data.html — elevation does not change, so this never needs refreshing.",
    source: "Open-Meteo Elevation API (Copernicus DEM GLO-90)",
    built: new Date().toISOString().slice(0, 10),
    complete: values.length >= TOTAL,
    lat0: LAT_MIN, lon0: LON_MIN, dLat: D_LAT, dLon: D_LON,
    rows: ROWS, cols: COLS,
    // Rounded to whole metres, sea clamped to 0 — sub-metre precision in
    // a hillshade is meaningless and rounding roughly halves the size.
    values: values.map(v => (v == null ? 0 : Math.max(0, Math.round(v))))
  };
  const blob = new Blob([JSON.stringify(output)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "elevation-uk.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// Re-acquires the wake lock after the tab comes back to the foreground —
// iOS releases it automatically when the tab is hidden.
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running && "wakeLock" in navigator) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
});

log(`Grid: ${ROWS} x ${COLS} = ${TOTAL.toLocaleString()} points, ${TOTAL_BATCHES} batches.`);
log(`Estimated time: about ${Math.round(TOTAL_BATCHES * DELAY_MS / 60000)} minutes.`);
loadProgress();
</script>
</body>
</html>
