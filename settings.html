<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2f6f4f">
  <title>Forecasters — Cloude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="back-link"><a href="index.html">&larr; Back to Cloude</a></p>
      <h1>Forecasters</h1>
      <p>Choose which sources appear in the comparison table.</p>
    </header>

    <section class="controls">
      <fieldset>
        <legend>Units</legend>
        <div class="checks">
          <label class="check">
            <input type="radio" name="unitSystem" id="unitMetric" value="metric">
            <span>Metric (mm, km/h, °C)</span>
          </label>
          <label class="check">
            <input type="radio" name="unitSystem" id="unitImperial" value="imperial">
            <span>Imperial (in, mph, °F)</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Hourly slider range</legend>
        <div class="checks">
          <label class="check">
            <input type="radio" name="hourRange" id="hourRange48" value="48">
            <span>48 hours ahead</span>
          </label>
          <label class="check">
            <input type="radio" name="hourRange" id="hourRange24" value="24">
            <span>24 hours ahead (if 48 feels too fiddly to drag)</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Available forecasters</legend>
        <div id="forecasters" class="checks"></div>
      </fieldset>
    </section>

    <footer>
      <span>Cloude</span>
      <span>Settings</span>
    </footer>
  </main>

  <script src="settings.js"></script>
</body>
</html>
