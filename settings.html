<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2f6f4f">
  <title>Settings — Cloude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="back-link"><a href="index.html">&larr; Back to Cloude</a></p>
      <h1>Settings</h1>
      <p>Location, places, units, and which forecasters appear on Compare.</p>
    </header>

    <section class="controls">
      <label>
        Current location
        <div class="location-row">
          <input id="postcode" value="TA6" maxlength="10" autocomplete="postal-code">
          <button id="updateLocation">Update</button>
        </div>
      </label>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Saved places</legend>
        <div id="placesList" class="places-list"></div>
        <button id="addCurrentPlace" type="button">Save current location</button>
        <p class="note">Switching to a saved place reuses whatever forecast history it already has, instead of starting fresh.</p>
      </fieldset>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Units</legend>
        <div class="checks">
          <label class="check">
            <input type="radio" name="unitSystem" id="unitMetric" value="metric">
            <span>Metric (mm, km/h, °C)</span>
          </label>
          <label class="check">
            <input type="radio" name="unitSystem" id="unitImperial" value="imperial">
            <span>Imperial (in, mph, °F)</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Hourly slider range</legend>
        <div class="checks">
          <label class="check">
            <input type="radio" name="hourRange" id="hourRange48" value="48">
            <span>48 hours ahead</span>
          </label>
          <label class="check">
            <input type="radio" name="hourRange" id="hourRange24" value="24">
            <span>24 hours ahead (if 48 feels too fiddly to drag)</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Available forecasters</legend>
        <div id="forecasters" class="checks"></div>
      </fieldset>
    </section>

    <nav class="bottom-nav">
      <a href="index.html">Cloude</a>
      <a href="compare.html">Compare</a>
      <a href="help.html">Help</a>
    </nav>
  </main>

  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
