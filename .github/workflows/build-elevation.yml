name: Build elevation data

# Manual only — no schedule. Elevation never changes, so this is a
# one-off job you run once and then forget about. Trigger it from the
# Actions tab: select this workflow, then "Run workflow".
#
# It takes roughly an hour, because it deliberately paces itself to stay
# under Open-Meteo's rate limit (see scripts/build-elevation.js). That's
# fine — it runs on GitHub's machines, not yours, and public repos get
# Actions minutes free. You can close the tab and come back to it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Default is 6 hours; this needs about one, but a generous ceiling
    # means a slow run or a few rate-limit backoffs can't kill the job
    # partway through and waste the work already done.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the elevation grid
        run: node scripts/build-elevation.js

      - name: Commit the elevation data
        run: |
          git config user.name "forecast-compare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/elevation-uk.json
          git diff --staged --quiet || git commit -m "Build static elevation grid"
          git push
