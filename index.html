<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2f6f4f">
  <title>Cloude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="title-bar">
        <h1>Cloude</h1>
        <button id="placeChip" class="place-chip" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="placeChipLabel">TA6</span>
          <span class="place-chip-caret" aria-hidden="true">&#9662;</span>
        </button>
        <div id="placeMenu" class="place-menu" hidden>
          <div id="placeMenuList"></div>
          <a class="place-menu-manage" href="settings.html">Manage places</a>
        </div>
      </div>
    </header>

    <section class="headline">
      <p id="headlineDate" class="headline-date">Today</p>
      <div id="headlineGrid" class="headline-grid"></div>
      <div class="hour-slider">
        <div class="hour-slider-title">
          <span>Hour</span>
          <span id="hourLabel">Now</span>
        </div>
        <input id="hourSlider" type="range" min="0" max="48" step="1" value="0">
      </div>
    </section>

    <section class="controls">
      <div class="rollback">
        <div class="rollback-title">
          <strong>Date</strong>
          <span id="rollbackLabel">Today</span>
        </div>
        <input id="rollback" type="range" min="-7" max="7" step="1" value="0">
        <div class="range-labels">
          <span>7 days ago</span>
          <span>Today</span>
          <span>7 days ahead</span>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <a href="compare.html">Compare</a>
      <a href="settings.html">Settings</a>
      <a href="help.html">Help</a>
    </nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
