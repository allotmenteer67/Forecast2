<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2f6f4f">
  <title>Cloude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Cloude</h1>
    </header>

    <section class="headline">
      <p id="headlineDate" class="headline-date">Today</p>
      <div id="headlineGrid" class="headline-grid"></div>
      <div class="hour-slider">
        <div class="hour-slider-title">
          <span>Hour</span>
          <span id="hourLabel">Now</span>
        </div>
        <input id="hourSlider" type="range" min="0" max="48" step="1" value="0">
      </div>
    </section>

    <section class="controls">
      <label class="condition-box">
        Condition
        <select id="condition">
          <option value="rain">Rain</option>
          <option value="cloud">Cloud</option>
          <option value="wind">Wind</option>
          <option value="temperature">Temperature</option>
          <option value="sunshine">Sunshine</option>
          <option value="uv">UV</option>
        </select>
      </label>

      <div class="rollback">
        <div class="rollback-title">
          <strong>Date</strong>
          <span id="rollbackLabel">Today</span>
        </div>
        <input id="rollback" type="range" min="-7" max="7" step="1" value="0">
        <div class="range-labels">
          <span>7 days ago</span>
          <span>Today</span>
          <span>7 days ahead</span>
        </div>
      </div>
    </section>

    <section class="comparison">
      <div class="table-title">
        <h2 id="conditionTitle">Rain</h2>
        <span id="locationLabel">TA6</span>
      </div>

      <div class="table-wrap">
        <table id="forecastTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <p id="actualStatus" class="actual-status status-error-only"></p>
      <p id="metOfficeStatus" class="actual-status status-error-only"></p>
    </section>

    <section class="controls">
      <label>
        Location
        <div class="location-row">
          <input id="postcode" value="TA6" maxlength="10" autocomplete="postal-code">
          <button id="updateLocation">Update</button>
        </div>
      </label>
    </section>

    <section class="comparison">
      <details class="accuracy" open>
        <summary>Accuracy so far</summary>
        <p id="historyStatus" class="actual-status"></p>
        <label class="accuracy-mode">
          Show
          <select id="accuracyMode">
            <option value="both">Both units and %</option>
            <option value="units">Units only</option>
            <option value="percent">Percent only</option>
          </select>
        </label>
        <div class="table-wrap">
          <table id="accuracyTable">
            <thead>
              <tr>
                <th>Forecaster</th>
                <th>Samples</th>
                <th>Raw</th>
                <th>Corrected</th>
              </tr>
            </thead>
            <tbody id="accuracyBody"></tbody>
          </table>
        </div>
      </details>

      <details class="backfill">
        <summary>Real Met Office history (advanced)</summary>
        <button id="backfillButton" type="button">Backfill 1 year of real Met Office data</button>
        <p id="backfillStatus" class="actual-status"></p>
      </details>
    </section>

    <footer>
      <span>Cloude</span>
      <span><a href="help.html">Help</a> · <a href="settings.html">Forecasters</a></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
