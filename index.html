<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2f6f4f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cloude">
  <title>Cloude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="title-bar">
        <h1>Cloude</h1>
        <button id="placeChip" class="place-chip" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="placeChipLabel">TA6</span>
          <span class="place-chip-caret" aria-hidden="true">&#9662;</span>
        </button>
        <div id="placeMenu" class="place-menu" hidden>
          <div id="placeMenuList"></div>
          <a class="place-menu-manage" href="settings.html">Manage places</a>
        </div>
      </div>
    </header>

    <section class="headline">
      <p id="headlineDate" class="headline-date">Today</p>
      <p id="headlineStatus" class="actual-status status-error-only"></p>
      <div id="headlineGrid" class="headline-grid"></div>
      <div class="hour-slider">
        <div class="hour-slider-title">
          <span>Today</span>
          <span id="hourLabel">+48h</span>
        </div>
        <input id="hourSlider" type="range" min="0" max="48" step="1" value="0">
      </div>
    </section>

    <section class="controls">
      <div class="rollback">
        <div class="rollback-title">
          <strong>Date</strong>
          <span id="rollbackLabel">Today</span>
        </div>
        <input id="rollback" type="range" min="-7" max="7" step="1" value="0">
        <div class="range-labels">
          <span>7 days ago</span>
          <span>Today</span>
          <span>7 days ahead</span>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <a href="compare.html">Compare</a>
      <a href="settings.html">Settings</a>
      <a href="help.html">Help</a>
    </nav>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">&times;</button>
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">Rain</h2>
      <span class="sheet-range" id="sheetRange"></span>
    </div>
    <div class="sheet-readout" id="sheetReadout">
      <span class="sheet-readout-time" id="readoutTime">Now</span>
      <span class="sheet-readout-value" id="readoutValue"></span>
    </div>
    <div id="sheetBody"></div>
    <p class="sheet-footnote" id="sheetFootnote"></p>
  </section>

  <script src="app.js"></script>
  <script>
    // Registers the service worker that makes the app shell load
    // instantly and offline (see sw.js) — done on every page, not just
    // this one, so it's active regardless of which page someone lands
    // on first.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
